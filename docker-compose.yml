services:
  techguild-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://techguild-backend.onrender.com}
    image: techguild-frontend:latest
    container_name: techguild_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
